name: Capsule frontend verification

on:
  pull_request:
  push:
    branches: [main, 'milestone-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Active-source guard
        run: npm run check:source
      - name: Reproduce locked dependencies
        run: npm ci
      - name: TypeScript application and test validation
        run: npm run typecheck
      - name: Complete browser suite (34 baseline tests)
        run: npm run test:ci
      - name: Production bundle
        run: npm run build -- --configuration production
      - name: Production dependency audit
        run: npm run audit:production

  development-dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deliberately fails until the known development-tool findings are resolved.
      - run: npm run audit:all
