<nav class="nav-bar">
  @if (authService.isLoggedIn()) {
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/my-capsules" routerLinkActive="active">My Capsules</a>
    <a routerLink="/create" routerLinkActive="active">New Capsule</a>
    <span class="spacer"></span>
    <button (click)="logout()">Logout ({{ username }})</button>
  } @else {
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/register" routerLinkActive="active">Register</a>
  }

</nav>
@if (logoutError) { <p role="alert">{{ logoutError }}</p> }
