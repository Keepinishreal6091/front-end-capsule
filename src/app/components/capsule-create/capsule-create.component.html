<div class="container mt-4">
  <h2>Create a Capsule</h2>
  <form #capsuleForm="ngForm" (ngSubmit)="saveCapsule()" [attr.aria-busy]="submitting">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input id="title" class="form-control" [(ngModel)]="title" name="title" maxlength="200" required>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea id="message" class="form-control" [(ngModel)]="messageInput" name="message" maxlength="10000" required></textarea>
    </div>
    <div class="mb-3">
      <label for="unlockAt" class="form-label">Unlock date and time</label>
      <input id="unlockAt" type="datetime-local" class="form-control" [(ngModel)]="unlockLocal" name="unlockAt" required aria-describedby="timezone">
      <p id="timezone" class="form-text">Your timezone: {{ timezone }}. Stored as a UTC instant.</p>
    </div>
    <button type="submit" class="btn btn-success" [disabled]="capsuleForm.invalid || submitting">{{ submitting ? 'Creating…' : 'Create Capsule' }}</button>
    @if (errorMessage) { <p class="text-danger mt-2" role="alert">{{ errorMessage }}</p> }
  </form>
  <a routerLink="/my-capsules" class="btn btn-secondary mt-3">Back to Capsules</a>
</div>
