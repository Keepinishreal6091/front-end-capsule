<div *ngIf="capsule">
  <h2>{{ capsule.title }}</h2>
  <p><strong>Unlocks:</strong> {{ capsule.unlockDate | date }}</p>

  <div *ngIf="isUnlocked; else locked">
    <h3>Message</h3>
    <ul>
      <li *ngFor="let msg of capsule.messages">
        <strong>{{ msg.timestamp | date:'medium' }}</strong>: {{ msg.text }}
      </li>
    </ul>
  </div>

  <ng-template #locked>
    <p>🔒 This capsule unlocks on {{ capsule.unlockDate | date:'longDate' }}</p>
  </ng-template>


  <div *ngIf="!isUnlocked" class="mt-3">
    <label for="newMessage">Add a new message:</label>
    <input [(ngModel)]="newMessage" id="newMessage" class="form-control" placeholder="Type your message here..." />
    <button class="btn btn-success mt-2" (click)="addMessageToCapsule()">Add Message</button>
  </div>
</div>
